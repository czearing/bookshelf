[package]
name = "bookshelf-identify"
version = "0.1.0"
edition = "2024"
description = "Verified book identification, cover selection and safe EPUB tagging for bookshelf"

[lib]
name = "bookshelf_identify"

[[bin]]
name = "bs-identify"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lingua = { version = "1.8", default-features = false, features = ["english", "french", "german", "spanish", "italian", "portuguese", "dutch", "russian", "polish", "swedish", "danish", "bokmal", "nynorsk", "finnish", "latin", "czech", "ukrainian", "greek", "turkish", "hungarian", "romanian", "catalan", "croatian", "serbian", "slovak", "slovene", "bulgarian", "afrikaans", "indonesian", "malay", "hebrew", "arabic", "japanese", "chinese", "korean"] }
# 0.29 links the same libsqlite3-sys as sqlx 0.7, so both can live in one workspace.
rusqlite = { version = "0.29", features = ["bundled"] }
isolang = "2.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
walkdir = "2"
whatlang = "0.16"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
